# /etc/nginx/sites-available/pirant.kz  (сертификат: certbot --nginx -d pirant.kz -d www.pirant.kz)
server {
    listen 80;
    server_name pirant.kz www.pirant.kz;
    return 301 https://pirant.kz$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pirant.kz;

    # ssl_certificate и ssl_certificate_key добавит certbot

    root /var/www/pirant/dist;            # собранный фронтенд (npm run build)
    index index.html;
    client_max_body_size 30m;              # импорт резервной копии; загрузки изображений ограничены 8 МБ на сервере

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }

    location /assets/ {                    # файлы с хэшем в имени можно кэшировать надолго
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {                           # SPA: /admin, /services/... отдают index.html
        try_files $uri /index.html;
    }
}
